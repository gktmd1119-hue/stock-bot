name: Daily Stock Briefing

on:
  schedule:
    # 월\~금 한국시간 오전 9:05
    - cron: '5 9 * * 1-5'
      timezone: 'Asia/Seoul'
    # 월\~금 한국시간 오후 3:35
    - cron: '35 15 * * 1-5'
      timezone: 'Asia/Seoul'
    # 월\~금 한국시간 저녁 8:05
    - cron: '5 20 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install requests
      - name: Run script
        run: python main.py
