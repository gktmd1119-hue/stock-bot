name: Daily Stock Briefing

on:
  schedule:
    # 월~금 한국시간 오전 9:00 (UTC 00:00)
    - cron: '0 0 * * 1-5'
    # 월~금 한국시간 오후 3:30 (UTC 06:30)
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install requests
      - name: Run script
        run: python main.py
