name: Daily Stock Briefing

on:
  schedule:
    # 월~금 한국시간 오전 9:05 (UTC 00:05)
    - cron: '5 0 * * 1-5'
    # 월~금 한국시간 오후 3:35 (UTC 06:35)
    - cron: '35 6 * * 1-5'
    # 월~금 한국시간 저녁 8:05 (UTC 11:05)
    - cron: '5 11 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install requests
      - name: Run script
        run: python main.py
